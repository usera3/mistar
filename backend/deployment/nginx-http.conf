# Included in http context; these zones affect only Qingliao.
limit_req_zone $binary_remote_addr zone=qingliao_api:512k rate=15r/s;
map $uri $qingliao_auth_key {
    default "";
    ~^/api/(login|register|auth/code|password/reset|password/change|email/bind)$ $binary_remote_addr;
}
limit_req_zone $qingliao_auth_key zone=qingliao_auth:512k rate=1r/s;
limit_conn_zone $binary_remote_addr zone=qingliao_http:512k;
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name chat.example.com;
    access_log off;
    error_log /var/log/nginx/qingliao-error.log crit;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    ssl_certificate /etc/qingliao/server.crt;
    ssl_certificate_key /etc/qingliao/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 20s;
    keepalive_requests 100;
    client_max_body_size 32k;
    limit_req zone=qingliao_api burst=45 nodelay;
    limit_req zone=qingliao_auth burst=8 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    limit_conn qingliao_http 16;
    limit_conn_status 429;
    limit_conn_log_level notice;
    error_page 413 = @qingliao_too_large;
    error_page 429 = @qingliao_too_many;
    location @qingliao_too_large {
        default_type application/json;
        return 413 '{"error":"上传或请求内容过大"}';
    }
    location @qingliao_too_many {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"error":"操作太频繁，请稍后再试"}';
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 190s;
    location = /api/uploads {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/bot/uploads {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/post-photos {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/post-media {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8765;
    }
    location ~ "^/api/post-media/[a-f0-9]{32}/cover$" {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/me/avatar {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/messages {
        client_max_body_size 900000;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/bot/messages {
        client_max_body_size 900000;
        proxy_pass http://127.0.0.1:8765;
    }
    location ~ "^/api/bot/calls/[a-f0-9-]{36}/signal$" {
        client_max_body_size 300000;
        proxy_pass http://127.0.0.1:8765;
    }
    location /api/ { proxy_pass http://127.0.0.1:8765; }
    location = /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
    location / { root /opt/qingliao/public; try_files $uri =404; }
}
