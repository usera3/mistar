# Include in the existing trusted HTTPS distribution vhost.
# Only these two exact paths are added; do not expose the general private API.
location = /xingyu/payments/notify {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 10s;
    limit_req zone=mistar_notify_requests burst=20 nodelay;
    access_log off;
    proxy_pass https://47.245.2.254/api/payments/notify;
    proxy_set_header Host 47.245.2.254;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_name 47.245.2.254;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/nginx/mistar-api-ca.crt;
    proxy_request_buffering on;
    proxy_connect_timeout 4s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /xingyu/payments/return {
    limit_except GET { deny all; }
    alias /var/www/xingyu/payment-return.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
