# Include only in api.claudcode.xyz's existing TLS server. Preserve other routes.
location = /xingyu/download { return 302 /xingyu/download/; }
location = /xingyu/download/ { rewrite ^ /xingyu/download/index.html last; }
location ~ "^/xingyu/download/(index\.html|style\.css|release\.js|icon\.svg)$" {
    root /var/www; try_files $uri =404;
    limit_except GET { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    access_log off;
}
location = /xingyu/releases/latest.json {
    root /var/www; try_files $uri =404;
    limit_except GET { deny all; }
    limit_req zone=xingyu_release_requests burst=15 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
location ~ "^/xingyu/releases/(latest|xingyu-[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}-[0-9]{1,7})\.apk$" {
    root /var/www; try_files $uri =404;
    limit_except GET { deny all; }
    limit_conn xingyu_download_connections 3;
    limit_rate_after 4m; limit_rate 4m;
    types {} default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="mistar.apk"' always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
# Do not route arbitrary paths to the root upstream application.
location /xingyu/download/ { return 404; }
location /xingyu/releases/ { return 404; }
