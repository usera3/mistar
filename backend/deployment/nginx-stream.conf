stream {
    limit_conn_zone $binary_remote_addr zone=qingliao_tcp_ip:1m;
    limit_conn_zone $server_addr zone=qingliao_tcp_total:512k;
    map $ssl_preread_protocol $qingliao_backend {
        "" 127.0.0.1:3479;
        default 127.0.0.1:8443;
    }
    server {
        listen 443;
        ssl_preread on;
        preread_timeout 5s;
        limit_conn qingliao_tcp_ip 24;
        limit_conn qingliao_tcp_total 96;
        limit_conn_log_level notice;
        proxy_protocol on;
        proxy_pass $qingliao_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 5m;
    }
    # Strip the frontend PROXY header before the existing coturn listener.
    server {
        listen 127.0.0.1:3479 proxy_protocol;
        proxy_protocol off;
        proxy_pass REPLACE_WITH_YOUR_PRIVATE_IP:3478;
        proxy_connect_timeout 5s;
        proxy_timeout 5m;
    }
}
