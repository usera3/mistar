<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src https://api.claudcode.xyz data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{width:100%;height:100%;margin:0;background:#eef0f4;font-family:system-ui,sans-serif}#status{position:absolute;z-index:800;left:50%;top:8px;transform:translateX(-50%);border-radius:14px;background:#fffffff0;color:#4d5260;padding:5px 10px;font-size:11px;max-width:65%;pointer-events:none}.leaflet-control-attribution{font-size:10px!important}.leaflet-touch .leaflet-bar a{width:34px;height:34px;line-height:34px}.position-label{white-space:nowrap;color:#252535;font-size:12px}#follow{position:absolute;z-index:800;bottom:25px;right:8px;border:0;background:white;color:#6b55cc;border-radius:18px;padding:9px 13px;box-shadow:0 1px 8px #0002;font-size:12px}
</style></head><body><div id="map" aria-label="位置地图"></div><div id="status">取得位置后显示地图</div><button id="follow" type="button">定位到标记</button><script src="leaflet.js"></script><script>
(function(){'use strict';var map=L.map('map',{zoomControl:true,attributionControl:true,dragging:true,doubleClickZoom:true,scrollWheelZoom:false});var tiles=L.tileLayer('https://api.claudcode.xyz/xingyu/map-tiles/{z}/{x}/{y}.png',{minZoom:2,maxZoom:18,keepBuffer:0,updateWhenIdle:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});var marker=null,accuracy=null,follow=true,current=null,loaded=0,errors=0;var status=document.getElementById('status');
window.mapState={ready:true,tilesLoaded:0,errors:0,loading:false,lat:null,lon:null,follow:true};
tiles.on('loading',function(){window.mapState.loading=true;});tiles.on('load',function(){window.mapState.loading=false;if(errors===0)status.style.display='none';});tiles.on('tileload',function(){loaded++;window.mapState.tilesLoaded=loaded;if(errors===0)status.style.display='none';});tiles.on('tileerror',function(){errors++;window.mapState.errors=errors;status.style.display='block';status.textContent='底图暂不可用，可点标记按钮重试';});map.on('dragstart',function(){follow=false;window.mapState.follow=false;});
window.setPosition=function(p){if(!p||!isFinite(p.lat)||!isFinite(p.lon))return;var first=!current;current=p;var xy=[Math.max(-85.05112878,Math.min(85.05112878,p.lat)),p.lon];var color=/^#[0-9a-fA-F]{6}$/.test(p.color)?p.color:'#7660d5';if(!marker){marker=L.circleMarker(xy,{radius:8,color:'#ffffff',weight:3,fillColor:color,fillOpacity:1}).addTo(map);accuracy=L.circle(xy,{radius:Math.min(50000,p.accuracy),color:color,weight:1,fillColor:color,fillOpacity:0.12}).addTo(map);var label=document.createElement('span');label.className='position-label';label.textContent=p.label;marker.bindTooltip(label);}else{marker.setLatLng(xy);accuracy.setLatLng(xy);accuracy.setRadius(Math.min(50000,p.accuracy));}
window.mapState.lat=p.lat;window.mapState.lon=p.lon;if(first){map.setView(xy,p.approximate||p.accuracy>1000?12:15);tiles.addTo(map);status.textContent='地图加载中…';}else if(follow)map.panTo(xy,{animate:true,duration:0.5});};
window.resumeMap=function(){map.invalidateSize(false);if(current&&errors>0){errors=0;window.mapState.errors=0;tiles.redraw();}};document.getElementById('follow').onclick=function(){follow=true;window.mapState.follow=true;errors=0;window.mapState.errors=0;if(current){map.panTo(marker.getLatLng());tiles.redraw();}};
})();
</script></body></html>
