<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src https://api.claudcode.xyz data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{width:100%;height:100%;margin:0;background:#eef0f4;font-family:system-ui,sans-serif}#status{position:absolute;z-index:800;left:50%;top:100px;transform:translateX(-50%);border-radius:16px;background:#fffffff0;color:#555c68;padding:7px 12px;font-size:12px;max-width:70%;text-align:center;pointer-events:none}.leaflet-control-attribution{font-size:10px!important}.leaflet-bottom{bottom:var(--safe-bottom,8px)}.leaflet-control-zoom{display:none}.position-label{color:#252535;font-size:12px}.avatar-pin{border:3px solid white;border-radius:50%;width:40px;height:40px;background:#7764cb;box-shadow:0 2px 8px #0004;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;overflow:hidden}.avatar-pin img{width:100%;height:100%;object-fit:cover}.meeting-pin{width:32px;height:32px;border-radius:50%;background:#f26d7b;border:3px solid white;box-shadow:0 2px 8px #0003;display:flex;align-items:center;justify-content:center;color:white;font-size:20px}#pin{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-100%) rotate(-45deg);z-index:650;pointer-events:none;width:28px;height:28px;background:#7660d5;border:3px solid white;border-radius:50% 50% 50% 3px;box-shadow:0 2px 8px #0003}#pin:after{content:'';position:absolute;width:12px;height:12px;background:white;border-radius:50%;left:8px;top:8px}
</style></head><body><div id="map" aria-label="地图"></div><div id="pin"></div><div id="status">正在加载地图…</div><script src="leaflet.js"></script><script>
(function(){'use strict';var map=L.map('map',{zoomControl:false,attributionControl:true,dragging:true,doubleClickZoom:true,scrollWheelZoom:false});var tiles=L.tileLayer('https://api.claudcode.xyz/xingyu/map-tiles/{z}/{x}/{y}.png',{minZoom:2,maxZoom:18,keepBuffer:0,updateWhenIdle:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});var marker=null,accuracy=null,current=null,follow=true,mode='view',first=true,dragging=false,revision=0,errors=0,actors={},meeting=null,cover=0;var status=document.getElementById('status');
window.mapState={ready:true,tilesLoaded:0,errors:0,loading:false,lat:null,lon:null,follow:true,interaction:{},participants:0};map.setView([20,105],3);if(window.innerWidth<350)map.attributionControl.setPrefix(false);
tiles.on('loading',function(){window.mapState.loading=true;});tiles.on('load',function(){window.mapState.loading=false;if(!errors)status.style.display='none';});tiles.on('tileload',function(){window.mapState.tilesLoaded++;if(!errors)status.style.display='none';});tiles.on('tileerror',function(){errors++;window.mapState.errors=errors;status.style.display='block';status.textContent='底图加载失败，请点定位按钮重试';});
map.on('dragstart',function(){dragging=true;follow=false;window.mapState.follow=false;});map.on('moveend',function(){if(mode==='pick'&&dragging){dragging=false;var c=map.containerPointToLatLng([map.getSize().x/2,map.getSize().y/2+cover/2]).wrap();window.mapState.interaction={id:++revision,lat:c.lat,lon:c.lng};window.mapState.lat=c.lat;window.mapState.lon=c.lng;}});
function pan(p,animate){var z=map.getZoom(),projected=map.project(xy(p),z);projected.y-=cover/2;map.panTo(map.unproject(projected,z),{animate:animate,duration:.35});}
function xy(p){return [Math.max(-85.05112878,Math.min(85.05112878,p.lat)),p.lon];}function color(p){return /^#[0-9a-fA-F]{6}$/.test(p.color)?p.color:'#7660d5';}
window.configureMap=function(value,bottom,accent,top){cover=Math.max(0,Math.min(300,top||0));document.getElementById('pin').style.top='calc(50% + '+(cover/2)+'px)';if(/^#[0-9a-fA-F]{6}$/.test(accent))document.getElementById('pin').style.backgroundColor=accent;mode=value;document.getElementById('pin').style.display=mode==='pick'?'block':'none';document.documentElement.style.setProperty('--safe-bottom',Math.max(8,bottom)+'px');};
window.setPosition=function(p){if(!p||!isFinite(p.lat)||!isFinite(p.lon))return;current=p;var location=xy(p);if(!marker){marker=L.circleMarker(location,{radius:7,color:'#fff',weight:3,fillColor:mode==='pick'?'#249cff':color(p),fillOpacity:1}).addTo(map);accuracy=L.circle(location,{radius:Math.min(50000,p.accuracy),color:color(p),weight:0,fillOpacity:0.11}).addTo(map);}else{marker.setLatLng(location);accuracy.setLatLng(location);accuracy.setRadius(Math.min(50000,p.accuracy));}
if(first){first=false;map.setView(location,p.approximate||p.accuracy>1000?12:16);pan(p,false);}else if(follow)pan(p,true);if(mode!=='pick'||follow){window.mapState.lat=p.lat;window.mapState.lon=p.lon;}};
window.selectPoint=function(p){if(!p)return;follow=false;window.mapState.follow=false;map.setZoom(Math.max(15,map.getZoom()));pan(p,false);window.mapState.lat=p.lat;window.mapState.lon=p.lon;};
window.centerPosition=function(){follow=true;window.mapState.follow=true;errors=0;window.mapState.errors=0;tiles.redraw();if(current){pan(current,true);if(mode==='pick')window.mapState.interaction={id:++revision,lat:current.lat,lon:current.lon,device:true};}};
function avatar(p){var node=document.createElement('div');node.className='avatar-pin';if(typeof p.avatar==='string'&&p.avatar.indexOf('data:image/png;base64,')===0){var image=document.createElement('img');image.src=p.avatar;node.appendChild(image);}else node.textContent=(p.name||'友').slice(0,1);return L.divIcon({html:node,className:'',iconSize:[46,46],iconAnchor:[23,46]});}
window.setActors=function(values){var seen={};values.forEach(function(p){if(!isFinite(p.lat)||!isFinite(p.lon))return;seen[p.key]=true;var entry=actors[p.key];if(!entry){entry=actors[p.key]=L.marker(xy(p),{icon:avatar(p)}).addTo(map);var text=document.createElement('span');text.textContent=p.name||'共享成员';entry.bindTooltip(text);}else{entry.setLatLng(xy(p));if(entry._avatar!==p.avatar||entry._name!==p.name)entry.setIcon(avatar(p));}entry._avatar=p.avatar;entry._name=p.name;entry._point=p;});Object.keys(actors).forEach(function(key){if(!seen[key]){map.removeLayer(actors[key]);delete actors[key];}});window.mapState.participants=Object.keys(actors).length;};
window.focusActor=function(key){if(actors[key]){follow=false;pan(actors[key]._point,true);}};
window.setMeeting=function(p){window.mapState.meeting=p;if(meeting){map.removeLayer(meeting);meeting=null;}if(p){var node=document.createElement('div');node.className='meeting-pin';node.textContent='⚑';meeting=L.marker(xy(p),{icon:L.divIcon({html:node,className:'',iconSize:[38,38],iconAnchor:[19,38]})}).addTo(map);var label=document.createElement('span');label.textContent=p.label||'集合点';meeting.bindTooltip(label);}};
window.resumeMap=function(){map.invalidateSize(false);if(!map.hasLayer(tiles))tiles.addTo(map);if(errors){errors=0;window.mapState.errors=0;tiles.redraw();}};
})();
</script></body></html>
