# Fixed origin only; shares the bounded existing raster cache/limits. No arbitrary URL proxy.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
if ($args != "") { return 400; }
limit_req zone=mistar_map_ip burst=24 nodelay;
limit_req zone=mistar_map_global burst=80 nodelay;
limit_req_status 429;
limit_conn mistar_map_connections 8;
limit_conn_status 429;
access_log off;
error_log /var/log/nginx/mistar-map-errors.log crit;
resolver 127.0.0.53 valid=300s ipv6=off;
proxy_pass https://tiles.openfreemap.org$mistar_vec_upstream;
proxy_set_header Host tiles.openfreemap.org;
proxy_set_header User-Agent "Mistar-Vector-Cache/1.0 (+https://github.com/usera3/mistar)";
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header Accept-Encoding "";
proxy_hide_header Set-Cookie;
proxy_ssl_server_name on;
proxy_ssl_name tiles.openfreemap.org;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 4;
proxy_connect_timeout 5s;
proxy_read_timeout 10s;
proxy_buffer_size 8k;
proxy_buffers 8 16k;
proxy_max_temp_file_size 2m;
proxy_cache mistar_map;
proxy_cache_key $uri;
proxy_cache_methods GET HEAD;
proxy_cache_valid 200 1d;
proxy_cache_valid 404 1m;
proxy_cache_revalidate on;
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
add_header X-Mistar-Map-Cache $upstream_cache_status always;
add_header X-Content-Type-Options nosniff always;
