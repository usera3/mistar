# Include alongside the existing raster map snippet inside the existing HTTPS server.
location = /xingyu/map-vector/planet.json {
    set $mistar_vec_upstream /planet;
    include /etc/nginx/snippets/mistar-vector-common.conf;
}
location ~ '^/xingyu/map-vector/planet/(?<mistar_vec_stamp>[0-9]{8}_[0-9]{6}_pt)/(?<mistar_vec_z>[0-9]|1[0-4])/(?<mistar_vec_x>[0-9]{1,5})/(?<mistar_vec_y>[0-9]{1,5})\.pbf$' {
    set $mistar_vec_upstream /planet/$mistar_vec_stamp/$mistar_vec_z/$mistar_vec_x/$mistar_vec_y.pbf;
    include /etc/nginx/snippets/mistar-vector-common.conf;
}
location /xingyu/map-vector/ { return 404; }
