# Include in nginx http{}; use only with nginx-mistar-map-server.conf.
proxy_cache_path /var/cache/nginx/mistar-map levels=1:2 keys_zone=mistar_map:2m max_size=128m inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=mistar_map_ip:1m rate=60r/m;
limit_req_zone $server_name zone=mistar_map_global:1m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=mistar_map_connections:1m;
