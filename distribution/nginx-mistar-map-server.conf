# Include inside the existing HTTPS server; never replace existing app/payment/TURN routes.
location ~ '^/xingyu/map-tiles/(?<mistar_map_z>[0-9]|1[0-8])/(?<mistar_map_x>[0-9]{1,6})/(?<mistar_map_y>[0-9]{1,6})\.png$' {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args != "") { return 400; }
    limit_req zone=mistar_map_ip burst=24 nodelay;
    limit_req zone=mistar_map_global burst=80 nodelay;
    limit_req_status 429;
    limit_conn mistar_map_connections 8;
    limit_conn_status 429;
    access_log off;
    error_log /var/log/nginx/mistar-map-errors.log crit;
    resolver 127.0.0.53 valid=300s ipv6=off;
    proxy_pass https://tile.openstreetmap.org/$mistar_map_z/$mistar_map_x/$mistar_map_y.png;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "Mistar-Map-Cache/1.0 (+https://github.com/usera3/mistar)";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_max_temp_file_size 1m;
    proxy_cache mistar_map;
    proxy_cache_key $uri;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    add_header X-Mistar-Map-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
}
location /xingyu/map-tiles/ { return 404; }
